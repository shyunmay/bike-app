<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <!-- 외부 라이브러리 없이 순수 CSS로 구현된 프리미엄 스타일링 -->
    <style>
        /* Modern CSS Reset and Variable Tokens */
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-green-bg: #ecfdf5;
            --accent-red: #ef4444;
            --accent-red-bg: #fef2f2;
            --accent-orange: #f59e0b;
            --accent-orange-bg: #fffbebf;
            --border-color: #e2e8f0;
            --primary-brand: #059669;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header Layout */
        header {
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Status Badge for Sample Data indicator */
        .data-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .data-badge.sample {
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .data-badge.live {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        /* Action Controls & Last Refreshed Time */
        .controls-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .last-updated {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn-refresh {
            background-color: var(--primary-brand);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-refresh:active {
            transform: translateY(0);
        }

        /* Summary Dashboard Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Search Section */
        .search-container {
            margin-bottom: 24px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            padding-left: 44px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: var(--bg-card);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .search-input:focus {
            border-color: var(--primary-brand);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Station Cards Grid */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .station-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .station-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Highlight border for empty stations */
        .station-card.empty-bikes {
            border-color: #fca5a5;
            background-color: #fff5f5;
        }

        .station-card.empty-bikes::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--accent-red);
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 8px;
        }

        .station-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .bike-count-badge {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 70px;
        }

        .bike-count {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .bike-count-badge.zero {
            color: var(--accent-red);
        }

        .bike-count-badge.available {
            color: var(--primary-brand);
        }

        .bike-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Detail Stats List */
        .station-details {
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
            color: var(--text-secondary);
        }

        /* Progress bar for visualization */
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* Loading indicator overlay */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Optimization */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            header {
                padding: 16px;
            }

            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls-area {
                width: 100%;
                justify-content: space-between;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Controls Section -->
        <header>
            <div class="header-top">
                <div class="title-area">
                    <h1>🚲 서울 따릉이 대여소 현황</h1>
                    <span id="dataStatusBadge" class="data-badge sample">샘플 데이터</span>
                </div>
                <div class="controls-area">
                    <span id="lastUpdatedTime" class="last-updated">갱신 시간: -</span>
                    <button id="refreshBtn" class="btn-refresh" onclick="fetchBikeData()">
                        <span id="btnIcon">↻</span> 새로고침
                    </button>
                </div>
            </div>
            
            <!-- Summary Dashboard -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">총 대여소 수</div>
                    <div class="value" id="statTotalStations">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">대여 가능 자전거</div>
                    <div class="value" id="statTotalBikes" style="color: var(--primary-brand);">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">대여 불가 대여소 (0대)</div>
                    <div class="value" id="statEmptyStations" style="color: var(--accent-red);">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">평균 거치율</div>
                    <div class="value" id="statAvgShared">0%</div>
                </div>
            </div>
        </header>

        <!-- Search Input -->
        <div class="search-container">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="대여소 이름 검색 (예: 망원역, 합정역)..." oninput="handleSearch()">
        </div>

        <!-- Station Cards Output Area -->
        <div id="stationsGrid" class="stations-grid">
            <!-- Dynamic JavaScript Content Loading -->
        </div>
    </div>

    <script>
        // 요구사항 샘플 데이터 정의
        const SAMPLE_DATA = {
            "rentBikeStatus": {
                "list_total_count": 5,
                "RESULT": {
                    "CODE": "INFO-000",
                    "MESSAGE": "정상 처리되었습니다."
                },
                "row": [
                    {
                        "rackTotCnt": "15",
                        "stationName": "102. 망원역 1번출구 앞",
                        "parkingBikeTotCnt": "11",
                        "shared": "73",
                        "stationLatitude": "37.55564880",
                        "stationLongitude": "126.91062927",
                        "stationId": "ST-4"
                    },
                    {
                        "rackTotCnt": "14",
                        "stationName": "103. 망원역 2번출구 앞",
                        "parkingBikeTotCnt": "12",
                        "shared": "86",
                        "stationLatitude": "37.55495071",
                        "stationLongitude": "126.91083527",
                        "stationId": "ST-5"
                    },
                    {
                        "rackTotCnt": "13",
                        "stationName": "104. 합정역 1번출구 앞",
                        "parkingBikeTotCnt": "16",
                        "shared": "123",
                        "stationLatitude": "37.55073929",
                        "stationLongitude": "126.91508484",
                        "stationId": "ST-6"
                    },
                    {
                        "rackTotCnt": "5",
                        "stationName": "105. 합정역 5번출구 앞",
                        "parkingBikeTotCnt": "0",
                        "shared": "0",
                        "stationLatitude": "37.55000687",
                        "stationLongitude": "126.91482544",
                        "stationId": "ST-7"
                    },
                    {
                        "rackTotCnt": "12",
                        "stationName": "106. 합정역 7번출구 앞",
                        "parkingBikeTotCnt": "1",
                        "shared": "8",
                        "stationLatitude": "37.54864502",
                        "stationLongitude": "126.91282654",
                        "stationId": "ST-8"
                    }
                ]
            }
        };

        // 전역 애플리케이션 상태
        let allStations = [];
        let filteredStations = [];

        // 데이터 Fetch 로직
        async function fetchBikeData() {
            const btnIcon = document.getElementById('btnIcon');
            const refreshBtn = document.getElementById('refreshBtn');
            const dataBadge = document.getElementById('dataStatusBadge');

            // 로딩 상태 표시
            btnIcon.className = 'loading-spinner';
            btnIcon.textContent = '';
            refreshBtn.disabled = true;

            let data;
            let isSample = false;

            try {
                // API 데이터 가져오기 시도
                const response = await fetch('/api/bike');
                if (!response.ok) {
                    throw new Error(`HTTP 오류: ${response.status}`);
                }
                data = await response.json();
                
                // 정상 응답 검증
                if (!data || !data.rentBikeStatus || !data.rentBikeStatus.row) {
                    throw new Error("유효하지 않은 응답 데이터 구조");
                }

                // 데이터 소스 표시 변경
                dataBadge.className = 'data-badge live';
                dataBadge.textContent = '실시간 API Data';

            } catch (error) {
                console.warn('/api/bike 로드 실패. 샘플 데이터로 전환합니다:', error);
                
                // 실패 시 샘플 데이터 폴백
                data = SAMPLE_DATA;
                isSample = true;

                dataBadge.className = 'data-badge sample';
                dataBadge.textContent = '샘플 데이터';
            } finally {
                // UI 로딩 해제
                btnIcon.className = '';
                btnIcon.textContent = '↻';
                refreshBtn.disabled = false;
            }

            // 데이터 처리 및 파싱 (문자열 -> 숫자 변환)
            const rawRows = data.rentBikeStatus.row || [];
            allStations = rawRows.map(item => ({
                stationName: item.stationName || '이름 없음',
                parkingBikeTotCnt: Number(item.parkingBikeTotCnt) || 0,
                rackTotCnt: Number(item.rackTotCnt) || 0,
                shared: Number(item.shared) || 0,
                stationId: item.stationId || ''
            }));

            // 갱신 시각 업데이트
            updateTimestamp();

            // 검색어에 맞게 필터링 및 렌더링
            handleSearch();
        }

        // 현재 시간 갱신 함수
        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('lastUpdatedTime').textContent = `마지막 갱신: ${timeString}`;
        }

        // 검색 필터링 핸들러
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!query) {
                filteredStations = [...allStations];
            } else {
                filteredStations = allStations.filter(station => 
                    station.stationName.toLowerCase().includes(query)
                );
            }

            updateDashboardStats();
            renderStations();
        }

        // 통계 대시보드 업데이트
        function updateDashboardStats() {
            const totalStations = allStations.length;
            const totalBikes = allStations.reduce((sum, s) => sum + s.parkingBikeTotCnt, 0);
            const emptyStations = allStations.filter(s => s.parkingBikeTotCnt === 0).length;
            const avgShared = totalStations > 0 
                ? Math.round(allStations.reduce((sum, s) => sum + s.shared, 0) / totalStations) 
                : 0;

            document.getElementById('statTotalStations').textContent = totalStations.toLocaleString();
            document.getElementById('statTotalBikes').textContent = totalBikes.toLocaleString();
            document.getElementById('statEmptyStations').textContent = emptyStations.toLocaleString();
            document.getElementById('statAvgShared').textContent = `${avgShared}%`;
        }

        // 화면에 대여소 리스트 렌더링
        function renderStations() {
            const grid = document.getElementById('stationsGrid');

            if (filteredStations.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>검색 결과가 없습니다</h3>
                        <p style="margin-top: 8px;">다른 대여소 이름을 입력해보세요.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredStations.map(station => {
                const isEmpty = station.parkingBikeTotCnt === 0;
                
                // 프로그레스 바 색상 계산
                let progressColor = 'var(--primary-brand)';
                if (isEmpty) {
                    progressColor = 'var(--accent-red)';
                } else if (station.shared > 100) {
                    progressColor = 'var(--accent-orange)';
                }

                return `
                    <div class="station-card ${isEmpty ? 'empty-bikes' : ''}">
                        <div class="station-header">
                            <div class="station-name">${escapeHtml(station.stationName)}</div>
                            <div class="bike-count-badge ${isEmpty ? 'zero' : 'available'}">
                                <span class="bike-count">${station.parkingBikeTotCnt}</span>
                                <span class="bike-label">대여가능</span>
                            </div>
                        </div>

                        <div>
                            <div class="station-details">
                                <span>총 거치대 수: <strong>${station.rackTotCnt}대</strong></span>
                                <span>거치율: <strong>${station.shared}%</strong></span>
                            </div>
                            
                            <!-- Visual Progress Bar -->
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${Math.min(station.shared, 100)}%; background-color: ${progressColor};"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // XSS 방지를 위한 HTML 이스케이프 유틸리티
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 페이지 초기 로드 시 실행
        window.addEventListener('DOMContentLoaded', () => {
            fetchBikeData();
        });
    </script>
</body>
</html>
